<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict CSP that still works from file:// in packaged builds ('self' = the app's own files):
      bundled fonts (woff2, small ones may be inlined as data:), data: SVG grain/hatch in CSS,
      WebGL canvases (need no CSP source). The renderer makes no network requests of its own:
      every fetch happens in main, so connect-src is 'self' only (Vite HMR in dev).
      style-src needs 'unsafe-inline' for React style attributes. frame-ancestors is not honoured
      in a <meta> CSP; the main process blocks navigation and framing instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Bloop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
