<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="560" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F748B1" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#F748B1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F748B1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4FBE8"/>
      <stop offset="0.5" stop-color="#9FF2D4"/>
      <stop offset="1" stop-color="#7EDDB9"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF0B4"/>
      <stop offset="1" stop-color="#3DBE86"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="190" ry="190"/>
    </clipPath>
  </defs>

  <!-- Squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="none" stroke="#1d2a3a" stroke-width="3"/>

  <!-- Pink glow behind creature -->
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)" clip-path="url(#tileClip)"/>

  <!-- Sprout leaf -->
  <path d="M512 330 Q510 296 518 262" fill="none" stroke="#2E8F68" stroke-width="14" stroke-linecap="round"/>
  <path d="M518 262 C 528 214 580 196 628 206 C 622 258 580 286 518 262 Z" fill="url(#leaf)" stroke="#2E8F68" stroke-width="8" stroke-linejoin="round"/>
  <path d="M530 248 C 556 232 586 220 610 216" fill="none" stroke="#2E8F68" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Body -->
  <ellipse cx="512" cy="566" rx="272" ry="244" fill="url(#body)" stroke="#2A7A62" stroke-width="12"/>
  <ellipse cx="420" cy="410" rx="92" ry="46" fill="#ffffff" opacity="0.45" transform="rotate(-20 420 410)"/>

  <!-- Blush cheeks -->
  <ellipse cx="392" cy="610" rx="46" ry="26" fill="#F748B1" opacity="0.8"/>
  <ellipse cx="632" cy="610" rx="46" ry="26" fill="#F748B1" opacity="0.8"/>

  <!-- Eyes -->
  <ellipse cx="428" cy="530" rx="44" ry="56" fill="#0a1420"/>
  <ellipse cx="596" cy="530" rx="44" ry="56" fill="#0a1420"/>
  <circle cx="442" cy="508" r="17" fill="#ffffff"/>
  <circle cx="610" cy="508" r="17" fill="#ffffff"/>
  <circle cx="422" cy="552" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="590" cy="552" r="7" fill="#ffffff" opacity="0.9"/>

  <!-- Smile -->
  <path d="M478 612 Q512 646 546 612" fill="none" stroke="#0a1420" stroke-width="14" stroke-linecap="round"/>
</svg>
