<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Study Pet app icon: flat black tile, white line-art pet. Achromatic, flat fills only. -->

  <!-- Squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="#000000"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" ry="188.5" fill="none" stroke="#3a3a3a" stroke-width="3"/>

  <!-- Flat ground shadow -->
  <ellipse cx="512" cy="836" rx="210" ry="18" fill="#3a3a3a"/>

  <!-- Feet -->
  <ellipse cx="400" cy="800" rx="62" ry="36" fill="#ffffff" stroke="#000000" stroke-width="18"/>
  <ellipse cx="624" cy="800" rx="62" ry="36" fill="#ffffff" stroke="#000000" stroke-width="18"/>

  <!-- Body -->
  <ellipse cx="512" cy="566" rx="272" ry="244" fill="#ffffff" stroke="#000000" stroke-width="22"/>
  <!-- ink gloss -->
  <path d="M300 520 Q318 430 392 380" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round"/>
  <path d="M286 572 L291 552" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round"/>

  <!-- Sprout: ink stem, white leaves with vein -->
  <path d="M512 326 Q510 292 518 258" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M518 262 C 528 214 580 196 628 206 C 622 258 580 286 518 262 Z" fill="#ffffff"/>
  <path d="M506 266 C 492 222 446 204 404 214 C 412 260 452 284 506 266 Z" fill="#ffffff"/>
  <path d="M534 250 C 560 236 588 224 610 218" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  <path d="M490 254 C 466 240 442 230 422 224" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>

  <!-- Blush: hatch marks -->
  <g stroke="#000000" stroke-width="11" stroke-linecap="round">
    <path d="M352 640 L370 600"/><path d="M382 640 L400 600"/><path d="M412 640 L430 600"/>
    <path d="M594 640 L612 600"/><path d="M624 640 L642 600"/><path d="M654 640 L672 600"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="428" cy="530" rx="44" ry="56" fill="#000000"/>
  <ellipse cx="596" cy="530" rx="44" ry="56" fill="#000000"/>
  <circle cx="442" cy="508" r="17" fill="#ffffff"/>
  <circle cx="610" cy="508" r="17" fill="#ffffff"/>
  <circle cx="422" cy="552" r="7" fill="#ffffff"/>
  <circle cx="590" cy="552" r="7" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M478 614 Q512 648 546 614" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
</svg>
